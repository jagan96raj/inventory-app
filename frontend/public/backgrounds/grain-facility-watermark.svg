  <path d="M820 500V220c0-8 12-16 28-16h36c16 0 28 8 28 16v280" stroke="currentColor" stroke-opacity="0.2" stroke-width="2.2"/>
  <ellipse cx="866" cy="220" rx="36" ry="14" stroke="currentColor" stroke-opacity="0.2" stroke-width="2.2"/>
  <path d="M848 260h36M848 300h36M848 340h36" stroke="currentColor" stroke-opacity="0.14" stroke-width="2"/>
</svg>
