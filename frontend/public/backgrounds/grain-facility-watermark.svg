<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="floor" x1="0" y1="520" x2="960" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <!-- warehouse floor -->
  <path d="M0 520h960v120H0z" fill="url(#floor)"/>
  <path d="M40 520h880" stroke="currentColor" stroke-opacity="0.25" stroke-width="2"/>
  <!-- conveyor -->
  <rect x="120" y="470" width="520" height="28" rx="6" stroke="currentColor" stroke-opacity="0.22" stroke-width="2"/>
  <circle cx="170" cy="484" r="10" stroke="currentColor" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="250" cy="484" r="10" stroke="currentColor" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="330" cy="484" r="10" stroke="currentColor" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="410" cy="484" r="10" stroke="currentColor" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="490" cy="484" r="10" stroke="currentColor" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="570" cy="484" r="10" stroke="currentColor" stroke-opacity="0.18" stroke-width="2"/>
  <!-- stacked 50kg bags - back row -->
  <g stroke="currentColor" stroke-width="2.2" stroke-opacity="0.28">
    <path d="M560 500V360l44-18 44 18v140H560z" fill="currentColor" fill-opacity="0.06"/>
    <path d="M648 500V360l44-18 44 18v140H648z" fill="currentColor" fill-opacity="0.05"/>
    <path d="M736 500V360l44-18 44 18v140H736z" fill="currentColor" fill-opacity="0.04"/>
    <path d="M604 342l44-18 44 18-44 18-44-18z" fill="currentColor" fill-opacity="0.08"/>
    <path d="M692 342l44-18 44 18-44 18-44-18z" fill="currentColor" fill-opacity="0.07"/>
    <path d="M780 342l44-18 44 18-44 18-44-18z" fill="currentColor" fill-opacity="0.06"/>
  </g>
  <!-- middle stack -->
  <g stroke="currentColor" stroke-width="2.4" stroke-opacity="0.34">
    <path d="M360 500V330l52-22 52 22v170H360z" fill="currentColor" fill-opacity="0.08"/>
    <path d="M464 500V330l52-22 52 22v170H464z" fill="currentColor" fill-opacity="0.07"/>
    <path d="M412 308l52-22 52 22-52 22-52-22z" fill="currentColor" fill-opacity="0.1"/>
    <path d="M516 308l52-22 52 22-52 22-52-22z" fill="currentColor" fill-opacity="0.09"/>
    <text x="392" y="410" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="currentColor" fill-opacity="0.22">50 KG</text>
    <text x="496" y="410" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="currentColor" fill-opacity="0.2">50 KG</text>
  </g>
  <!-- foreground bags -->
  <g stroke="currentColor" stroke-width="2.6" stroke-opacity="0.4">
    <path d="M150 500V300l58-24 58 24v200H150z" fill="currentColor" fill-opacity="0.1"/>
    <path d="M266 500V300l58-24 58 24v200H266z" fill="currentColor" fill-opacity="0.09"/>
    <path d="M208 276l58-24 58 24-58 24-58-24z" fill="currentColor" fill-opacity="0.12"/>
    <text x="182" y="392" font-family="Inter,Segoe UI,sans-serif" font-size="24" font-weight="700" fill="currentColor" fill-opacity="0.28">50 KG</text>
    <text x="298" y="392" font-family="Inter,Segoe UI,sans-serif" font-size="24" font-weight="700" fill="currentColor" fill-opacity="0.24">50 KG</text>
  </g>
