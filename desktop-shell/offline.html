<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Inventory App</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f7f5;
        --ink: #1c2b24;
        --muted: #5c6b63;
        --card: #ffffff;
        --line: #d5e0da;
        --accent: #0f6b4c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", system-ui, sans-serif;
        background:
          radial-gradient(circle at top left, #e6f3ec 0%, transparent 45%),
          linear-gradient(180deg, #eef5f1 0%, var(--bg) 100%);
        color: var(--ink);
        padding: 24px;
      }
      main {
        width: min(440px, 100%);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 36px 32px;
        box-shadow: 0 18px 50px rgba(28, 43, 36, 0.08);
        text-align: center;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 1.6rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.5;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        padding: 12px 22px;
        cursor: pointer;
      }
      button:hover {
        filter: brightness(1.05);
      }
      button:disabled {
        opacity: 0.7;
        cursor: wait;
      }
      .status {
        margin-top: 16px;
        min-height: 1.25em;
        font-size: 0.92rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>
        This app needs an internet connection to reach the Raj Agro server.
        Connect to Wi‑Fi or mobile data, then try again.
      </p>
      <button id="retry" type="button">Try again</button>
      <div class="status" id="status" aria-live="polite"></div>
    </main>
    <script>
      const { ipcRenderer } = require("electron");
      const btn = document.getElementById("retry");
      const status = document.getElementById("status");

      async function retry() {
        btn.disabled = true;
        status.textContent = "Checking connection…";
        try {
          const ok = await ipcRenderer.invoke("retry-online");
          if (!ok) status.textContent = "Still offline. Check internet and retry.";
        } catch {
          status.textContent = "Still offline. Check internet and retry.";
        } finally {
          btn.disabled = false;
        }
      }

      btn.addEventListener("click", retry);
    </script>
  </body>
</html>
